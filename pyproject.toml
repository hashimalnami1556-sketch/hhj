[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nar-blender-automation"
version = "1.0.0"
description = "Production-ready Blender asset automation framework for game development"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "NAR Chronicles Development", email = "dev@narchronicles.com"}
]
keywords = ["blender", "game-development", "asset-pipeline", "lod", "pbr", "uv", "retopology"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = []

[project.optional-dependencies]
cloud = [
    "requests>=2.25.0",
    "boto3>=1.17.0",
    "aiohttp>=3.7.0",
]
monitoring = [
    "prometheus-client>=0.9.0",
]
database = [
    "sqlalchemy>=1.4.0",
    "psycopg2-binary>=2.8.0",
]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "black>=21.0",
    "flake8>=3.9.0",
    "mypy>=0.900",
]

[project.urls]
"Homepage" = "https://github.com/h-alnami/hhj"
"Documentation" = "https://github.com/h-alnami/hhj/tree/main/src/blender_automation"
"Repository" = "https://github.com/h-alnami/hhj"
"Bug Tracker" = "https://github.com/h-alnami/hhj/issues"

[project.scripts]
blender-asset-pipeline = "blender_automation.main:main"

[tool.setuptools]
packages = ["blender_automation"]
package-dir = {"" = "src"}

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=src/blender_automation --cov-report=html"

[tool.coverage.run]
source = ["src/blender_automation"]
omit = ["*/tests/*"]
